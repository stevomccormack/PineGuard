version: 2

updates:
  # NuGet packages (Central Package Management via Directory.Packages.props)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      xunit:
        patterns: ["xunit*"]
      microsoft-test:
        patterns: ["Microsoft.NET.Test.*", "coverlet.*"]
      microsoft-codeanalysis:
        patterns: ["Microsoft.CodeAnalysis*"]
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      result-libraries:
        patterns: ["ErrorOr", "FluentResults", "OneOf"]
    ignore:
      # MediatR 13+ moved to a commercial licence. 12.5.x is the last Apache-2.0 line and
      # Directory.Packages.props pins it deliberately (see the comment there); a bump past it
      # once merged unreviewed, broke 4 tests and had to be reverted (e17d1d6).
      - dependency-name: "MediatR"
        update-types: ["version-update:semver-major"]
      # The .NET 11 package wave dropped net8.0, which Directory.Build.props still targets
      # (netstandard2.1;net8.0;net10.0;net11.0). On net8.0 the 11.x packages fall back to their
      # netstandard2.0 assets, which breaks the build two ways: the netstandard polyfill chain
      # re-introduces the phantom CS0419 CallerArgumentExpressionAttribute cref ambiguity that
      # Directory.Build.props only suppresses for netstandard2.1 (PRs #74, #76), and the test
      # host dies at runtime on `JsonObjectInfoValues`1.set_ObjectCreator` (PR #69). PineGuard
      # also publishes these as public dependencies, so a major bump would raise the floor for
      # every consumer with no API gain — against the lowest-line pinning policy recorded in
      # Directory.Packages.props. System.Security.Cryptography.Pkcs and Microsoft.Bcl.TimeProvider
      # slipped through this hold (#73, #75): Pkcs 11.0.0 and its dependency chain warn on restore
      # that they do not support net8.0 (AO-12), and TimeProvider is a published netstandard2.1
      # dependency of PineGuard.Core, so both are returned to 10.0.x and held here. Lift these
      # five entries when net8.0 is dropped as a target (.NET 8 left support on 2026-11-10),
      # not before.
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.SourceLink.GitHub"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Bcl.TimeProvider"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
