# docker-compose.sonarqube.yml
# SonarQube Community Edition — local dev server for PineGuard.
#
# Do not run directly. Use tools/code-scan/sonarqube/Start-SonarQube.ps1 / Stop-SonarQube.ps1
# (or tools/docker/docker-up.ps1 / docker-down.ps1 to bring up both stacks together).
#
# First run: default credentials are admin / admin (SonarQube will prompt to change).
# Analysis:  run tools/code-scan/sonarqube/Run-SonarScanner.ps1 once the server is UP.
#
# Network: pineguard must exist before running (docker-network.ps1 creates it).

name: pineguard

services:
  sonarqube:
    # Pinned to the 2025.1 LTA (Long-Term Active) Community Edition release, not the
    # floating :community tag — see F-51 in docs/ai/plans/tools-review-and-standardisation.md.
    image: sonarqube:2025.1-community
    container_name: pineguard-sonarqube
    ports:
      # Loopback-only — the admin UI must not be reachable from the LAN (F-23).
      - "127.0.0.1:9001:9000"
    environment:
      # Disables Elasticsearch bootstrap checks — required for local dev on Windows/Mac.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - pineguard-sonarqube-data:/opt/sonarqube/data
      - pineguard-sonarqube-extensions:/opt/sonarqube/extensions
      - pineguard-sonarqube-logs:/opt/sonarqube/logs
    networks:
      - pineguard
    stop_grace_period: 60s
    healthcheck:
      # /api/system/status only reports "UP" once SonarQube has finished starting
      # (first boot can take 1-2 minutes) — not just that the process launched.
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  pineguard-sonarqube-data:
    name: pineguard-sonarqube-data
  pineguard-sonarqube-extensions:
    name: pineguard-sonarqube-extensions
  pineguard-sonarqube-logs:
    name: pineguard-sonarqube-logs

networks:
  pineguard:
    external: true
    name: pineguard
