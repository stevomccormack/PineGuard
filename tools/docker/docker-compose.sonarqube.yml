# docker-compose.sonarqube.yml
# SonarQube Community Edition — local dev server for PineGuard.
#
# Do not run directly. Use tools/code-scan/sonarqube/Start-SonarQube.ps1 / Stop-SonarQube.ps1
# (or tools/docker/docker-up.ps1 / docker-down.ps1 to bring up both stacks together).
#
# First run: default credentials are admin / admin (SonarQube will prompt to change).
# Analysis:  run tools/code-scan/sonarqube/Run-SonarScanner.ps1 once the server is UP.
#
# Network: pineguard must exist before running (docker-network.ps1 creates it).

name: pineguard

services:
  sonarqube:
    # Pinned to the 26.11.0 Community Build release, not the floating :community tag — see F-51 in
    # docs/ai/plans/tools-review-and-standardisation.md. Docker Hub retired the `2025.1-community`
    # alias (2026-11-09: "not found"), and the existing data volume already holds a newer Elasticsearch
    # index (8.19.x), which the 25.1.0 build refuses to downgrade; the current build is pinned instead.
    # The volumes carry a -v26 suffix because the embedded H2 database cannot be migrated in place
    # ("Upgrade is not supported on embedded database"); the pre-2026-11-09 volumes are left untouched.
    image: sonarqube:26.11.0.134175-community
    container_name: pineguard-sonarqube
    ports:
      # Loopback-only — the admin UI must not be reachable from the LAN (F-23).
      - "127.0.0.1:9001:9000"
    environment:
      # Disables Elasticsearch bootstrap checks — required for local dev on Windows/Mac.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - pineguard-sonarqube-data-v26:/opt/sonarqube/data
      - pineguard-sonarqube-extensions-v26:/opt/sonarqube/extensions
      - pineguard-sonarqube-logs-v26:/opt/sonarqube/logs
    networks:
      - pineguard
    stop_grace_period: 60s
    healthcheck:
      # /api/system/status only reports "UP" once SonarQube has finished starting
      # (first boot can take 1-2 minutes) — not just that the process launched.
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  pineguard-sonarqube-data-v26:
    name: pineguard-sonarqube-data-v26
  pineguard-sonarqube-extensions-v26:
    name: pineguard-sonarqube-extensions-v26
  pineguard-sonarqube-logs-v26:
    name: pineguard-sonarqube-logs-v26

networks:
  pineguard:
    external: true
    name: pineguard
