# =================================================================================================
# SonarQube Project Properties
# =================================================================================================
# Single source of truth for SonarQube analysis configuration.
# Read by Run-SonarScanner.ps1 via Import-SonarProperties and passed as /d: parameters
# to dotnet-sonarscanner (which does not natively read this file).
# =================================================================================================

# --- Source exclusions ---
# The .NET scanner auto-indexes the repo root, picking up config/tooling files that trigger
# encoding false-positives. Only src/ contains analysable source code.
sonar.exclusions=\
  docs/**/*,\
  tests/**/*,\
  tools/**/*,\
  .agent/**/*,\
  .amazonq/**/*,\
  .claude/**/*,\
  .clinerules/**/*,\
  .cursor/**/*,\
  .github/**/*,\
  .junie/**/*,\
  .pi/**/*,\
  .vs/**/*,\
  .vscode/**/*,\
  .windsurf/**/*,\
  .etc/**/*,\
  artifacts/**/*,\
  coverage-results/**/*,\

# --- Coverage exclusions ---
# OpenCover format does not attribute coverage to abstract base class methods when
# exercised through derived classes. Coverlet (cobertura) confirms 100% coverage for
# these files — this exclusion prevents false negatives in SonarQube's coverage report.
sonar.coverage.exclusions=\
  src/PineGuard.DataAnnotations/Common/ValidationAttributeBase.cs,\
  src/PineGuard.DataAnnotations/Common/GenericDictionaryAttributeBase.cs

# --- Copy-paste detection exclusions ---
# Structural cross-type duplication (string overloads mirror native-type overloads by design).
sonar.cpd.exclusions=\
  src/PineGuard.MustClauses/MustString*.cs,\
  src/PineGuard.MustClauses/MustCollectionClauses.cs,\
  src/PineGuard.MustClauses/MustBitWiseClauses.cs,\
  src/PineGuard.GuardClauses/Guard*TimeSpanClauses.cs,\
  src/PineGuard.DataAnnotations/*Attributes.cs

# --- Rule suppressions ---
# S107: parameter count is by-design — domain params + message/exceptionCreator/paramName
#       infrastructure. Standard pattern in guard clause libraries.
# S3236: passing paramName: null to [CallerArgumentExpression] is intentional — these layers
#        deliberately suppress auto-capture because the captured expression would be a useless
#        lambda variable.
sonar.issue.ignore.multicriteria=s107guard,s107must,s3236guard,s3236must,s3236fluent,s3236da,s1192mustnumbers,s1481network,s3267network,s3267objectattr,s3267dict,s3267rodict,s3458coreutils,s2219objectattr,s2219objectrules,s1210enumeration,ca1859basetest,s3376validationbase,s4144guardstring,s4035enumeration,s125isodatetime,s2094polyfill

sonar.issue.ignore.multicriteria.s107guard.ruleKey=csharpsquid:S107
sonar.issue.ignore.multicriteria.s107guard.resourceKey=src/PineGuard.GuardClauses/**

sonar.issue.ignore.multicriteria.s107must.ruleKey=csharpsquid:S107
sonar.issue.ignore.multicriteria.s107must.resourceKey=src/PineGuard.MustClauses/**

sonar.issue.ignore.multicriteria.s3236guard.ruleKey=csharpsquid:S3236
sonar.issue.ignore.multicriteria.s3236guard.resourceKey=src/PineGuard.GuardClauses/**

sonar.issue.ignore.multicriteria.s3236must.ruleKey=csharpsquid:S3236
sonar.issue.ignore.multicriteria.s3236must.resourceKey=src/PineGuard.MustClauses/**

sonar.issue.ignore.multicriteria.s3236fluent.ruleKey=csharpsquid:S3236
sonar.issue.ignore.multicriteria.s3236fluent.resourceKey=src/PineGuard.FluentValidation/**

